<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <title>Application Error</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; text-align: center; }
        .error-box { padding: 20px; background-color: #fff0f0; border: 1px solid #ffcccc; display: inline-block; border-radius: 5px; }
        h2 { color: #cc0000; margin-top: 0; }
        a { display: inline-block; margin-top: 20px; text-decoration: none; color: #0066cc; }
    </style>
</head>
<body>

<div class="error-box">
    <h2>Action Required</h2>
    <!-- Displays the dynamic message populated by @ControllerAdvice -->
    <p th:text="${errorMessage}">An unknown error occurred.</p>
    <a th:href="@{/}">← Back to Product Inventory</a>
</div>

</body>
</html>
